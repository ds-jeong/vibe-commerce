spring:
  application:
    name: vibe-commerce

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

portone:
  api-secret: ${PORTONE_API_SECRET:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

supabase:
  url: ${SUPABASE_URL:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

app:
  frontend-origin: ${FRONTEND_ORIGIN:*}

llm:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:15}
  max-requests-per-minute: ${LLM_MAX_REQUESTS_PER_MINUTE:10}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

server.port=${PORT:8080}

portone.api-secret=${PORTONE_API_SECRET:}

file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
supabase.url=${SUPABASE_URL:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.frontend-origin=${FRONTEND_ORIGIN:*}

llm.api-key=${GEMINI_API_KEY:}
llm.base-url=https://generativelanguage.googleapis.com/v1beta
llm.model=${GEMINI_MODEL:gemini-3.8-flash}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:15}
llm.max-requests-per-minute=${LLM_MAX_REQUESTS_PER_MINUTE:10}

spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
